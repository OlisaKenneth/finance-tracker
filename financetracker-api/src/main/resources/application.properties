# application name
spring.application.name=financetracker-api

# database connection
# locally: uses SQLite file on disk
# on Railway: uses PostgreSQL via environment variables
# SPRING_DATASOURCE_URL is built from Railway's individual Postgres variables
# so Spring Boot gets a proper jdbc:postgresql:// URL instead of postgres://
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:data/financetracker.db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# database driver
# locally: SQLite driver
# on Railway: PostgreSQL driver (set via DB_DRIVER environment variable)
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}

# hibernate dialect ? switches automatically based on database
# locally: SQLite dialect
# on Railway: PostgreSQL dialect (set via DB_DIALECT environment variable)
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update

# show SQL queries in console so we can see what is happening
spring.jpa.show-sql=true