# application name
spring.application.name=financetracker-api

# database connection ? Railway provides this URL automatically
# when i deploy it, Railway sets DATABASE_URL environment variable
# locally we still use SQLite for development
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:data/financetracker.db}
spring.datasource.driver-class-name=${DB_DRIVER:org.sqlite.JDBC}

# hibernate dialect ? switches automatically based on database
# tell Hibernate to use SQLite dialect
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update

# show SQL queries in console
spring.jpa.show-sql=true


