# application name ? this is just the name of your Spring Boot app
spring.application.name=financetracker-api

# ???????????????????????????????????????????????
# DATABASE CONNECTION
# ???????????????????????????????????????????????

# the full URL to connect to the PostgreSQL database
# format: jdbc:postgresql://host:port/databasename
# Railway sets SPRING_DATASOURCE_URL automatically when you add PostgreSQL
# example of what Railway sets it to:
# jdbc:postgresql://postgres.railway.internal:5432/railway
spring.datasource.url=${SPRING_DATASOURCE_URL}

# the username to log into the PostgreSQL database
# think of it like a username to a website account
# Railway sets SPRING_DATASOURCE_USERNAME automatically
# example: postgres
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

# the password to log into the PostgreSQL database
# think of it like a password to a website account
# Railway sets SPRING_DATASOURCE_PASSWORD automatically
# example: exMcJaSYoVuLfMStdqwYdu (random string Railway generates)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# tells Spring Boot WHICH database driver to use to talk to the database
# a driver is like a translator between Java and the database
# org.postgresql.Driver = the PostgreSQL translator
# this is why we added postgresql dependency in pom.xml earlier
spring.datasource.driver-class-name=org.postgresql.Driver

# ???????????????????????????????????????????????
# HIBERNATE (JPA) SETTINGS
# ???????????????????????????????????????????????

# tells Hibernate which SQL dialect (language style) to use
# every database has slightly different SQL syntax
# PostgreSQL dialect = use PostgreSQL's version of SQL
# this is what generates the correct SQL statements for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# tells Hibernate what to do with your database tables on startup
# update = create tables if they don't exist
#          add new columns if you added new fields
#          NEVER delete existing data
# other options:
# create      = delete everything and recreate tables on every restart (dangerous)
# create-drop = delete tables when app shuts down (only for testing)
# validate    = check tables match your entities but don't change anything
# none        = do nothing at all
spring.jpa.hibernate.ddl-auto=update

# prints every SQL query Hibernate runs in the console
# useful for debugging ? you can see exactly what SQL is being sent to the database
# example output: select b.id, b.category from budgets b where b.id=1
# set to false in production to keep logs clean (we can do this later)
spring.jpa.show-sql=true